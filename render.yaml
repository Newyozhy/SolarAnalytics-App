services:
  - type: web
    name: solarapp-backend
    env: python
    buildCommand: pip install -r requirements.txt
    # --workers 1: un solo proceso para limitar uso de RAM en el plan Free (512MB)
    # --limit-concurrency 4: evita que m\u00faltiples requests pesados corran en paralelo
    # --timeout-keep-alive 65: cierre limpio de conexiones
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 4 --timeout-keep-alive 65
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON_PATH
        value: credentials.json
      # NOTE: For production, you will need to upload your credentials.json securely.
      # You can also encode it in base64 and decode it on startup.
